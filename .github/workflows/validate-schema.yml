name: Validate JSON Schema Definition

on: [push, pull_request]

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Validate Schema Structure
        run: |
          npm install -g ajv-cli
          # -c compiles the schema to check for syntax and draft compliance
          ajv compile -s **/*.schema.json --spec=draft2020